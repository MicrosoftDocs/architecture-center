name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    if: github.repository == 'MicrosoftDocs/architecture-center-pr'
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      # Job-level `if` is ignored during Copilot provisioning, so guard each step.
      - name: Checkout repository
        if: github.repository == 'MicrosoftDocs/architecture-center-pr'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw extension
        if: github.repository == 'MicrosoftDocs/architecture-center-pr'
        uses: github/gh-aw-actions/setup-cli@b304200a0ef4b3998673bfc7945acb08ab8c88b7 # v0.87.2
        with:
          version: v0.86.2
