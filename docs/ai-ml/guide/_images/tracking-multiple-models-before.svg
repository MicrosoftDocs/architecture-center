    <rect class="card" x="275" y="239" width="112" height="50"/>
    <use href="#model-icon" x="284" y="249" width="28" height="28"/>
    <text class="small" x="319" y="269">gpt-5-mini</text>
    <rect class="card" x="275" y="298" width="112" height="50"/>
