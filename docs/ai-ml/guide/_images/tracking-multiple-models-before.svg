    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#2f2f2f;font-size:13px}
      .small{font-size:12px}.group-title{font-size:12px}.center{text-anchor:middle}
      .resource-shadow{fill:#8e8278;fill-opacity:.3}.resource{fill:#e1ddd8;stroke:#a79f98;stroke-width:.7}
      .zone{fill:#f8fcfe;stroke:#53b1e0;stroke-width:.65}.card{fill:#fff;stroke:#0078d4;stroke-width:.65}
      .client{fill:#f4f3f5;stroke:#777677;stroke-width:.7}.connector{fill:none;stroke:#3c3c41;stroke-width:1.1;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:4 3}.telemetry{fill:none;stroke:#3c3c41;stroke-width:1.1}
    </style>
