<svg xmlns="http://www.w3.org/2000/svg" width="8.54167in" height="5.3125in" viewBox="0 0 820 510" role="img" aria-labelledby="title description">
  <title id="title">Direct access to model deployments across Foundry resources</title>
  <desc id="description">Clients A and B connect directly to four Azure OpenAI model deployments across two Microsoft Foundry resources. Both resources send native metrics and logs to Azure Monitor.</desc>
