  <rect width="820" height="510" fill="#fff"/>

  <g aria-label="Client A">
    <rect class="client" x="20" y="105" width="88" height="92"/>
    <use href="#client-icon" x="52" y="124" width="24" height="24"/>
    <text class="center" x="64" y="173">Client A</text>
  </g>
  <g aria-label="Client B">
    <rect class="client" x="20" y="285" width="88" height="92"/>
    <use href="#client-icon" x="52" y="304" width="24" height="24"/>
    <text class="center" x="64" y="353">Client B</text>
  </g>

