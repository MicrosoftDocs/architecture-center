<svg xmlns="http://www.w3.org/2000/svg" width="9.79167in" height="6.14583in" viewBox="0 0 940 590" role="img" aria-labelledby="title description">
  <title id="title">Gateway-based input and output monitoring across Foundry resources</title>
  <desc id="description">Clients A and B connect to an Azure API Management gateway that can return cached responses. The gateway routes requests through private endpoints to four Azure OpenAI model deployments across two Microsoft Foundry resources. The gateway sends captured inputs and outputs to Azure Monitor, while both Foundry resources independently send native metrics and logs to Azure Monitor.</desc>
