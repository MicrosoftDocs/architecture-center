<svg xmlns="http://www.w3.org/2000/svg" width="9.79167in" height="5.72917in" viewBox="0 0 940 550" role="img" aria-labelledby="title description">
  <title id="title">Gateway-based usage monitoring across Foundry resources</title>
  <desc id="description">Clients A and B connect to an Azure API Management gateway. The gateway routes requests through private endpoints to four Azure OpenAI model deployments in two Microsoft Foundry resources and sends client, model, and token-usage telemetry to Azure Monitor. Both Foundry resources independently send native metrics and logs to Azure Monitor.</desc>
