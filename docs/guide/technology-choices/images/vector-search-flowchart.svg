<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="940" viewBox="0 0 1750 940"
     font-family="Segoe UI, Arial, sans-serif">
  <title>Choose an Azure service for vector search</title>
  <desc>Decision tree for choosing among Azure Managed Redis, Azure Database for PostgreSQL (with Elastic Clusters), Azure SQL Database, Azure Cosmos DB for NoSQL, Azure DocumentDB, and Azure AI Search.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3f3f"/>
    </marker>
    <style type="text/css"><![CDATA[
      .decision { fill: #3955a3; stroke: #1a2c5b; stroke-width: 1; }
      .terminal { fill: #a5a5a5; stroke: #6d6d6d; stroke-width: 0.5; }
      .start { fill: #4bacc6; stroke: #2f7a8c; stroke-width: 0.5; }
      .qtext { fill: #ffffff; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .ttext { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .connector { fill: none; stroke: #3f3f3f; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .ynlabel { fill: #000000; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .ynbg { fill: #ffffff; }
    ]]></style>
  </defs>

  <!-- Opaque white background -->
  <rect x="0" y="0" width="1750" height="940" fill="#ffffff"/>

  <!-- Connectors first so nodes render on top -->
  <path d="M 935,64 L 935,95" class="connector" marker-end="url(#arrow)"/>
  <path d="M 775,140 L 500,140 L 500,235" class="connector" marker-end="url(#arrow)"/>
  <rect x="634" y="120" width="32" height="15" class="ynbg"/>
  <text x="650" y="132" class="ynlabel">Yes</text>
  <path d="M 1095,140 L 1380,140 L 1380,235" class="connector" marker-end="url(#arrow)"/>
  <rect x="1208" y="120" width="24" height="15" class="ynbg"/>
  <text x="1220" y="132" class="ynlabel">No</text>
  <path d="M 340,280 L 240,280" class="connector" marker-end="url(#arrow)"/>
  <rect x="259" y="260" width="32" height="15" class="ynbg"/>
  <text x="275" y="272" class="ynlabel">Yes</text>
  <path d="M 500,325 L 500,365" class="connector" marker-end="url(#arrow)"/>
  <rect x="508" y="346" width="24" height="15" class="ynbg"/>
  <text x="520" y="358" class="ynlabel">No</text>
  <path d="M 1540,280 L 1530,280" class="connector" marker-end="url(#arrow)"/>
  <rect x="1544" y="260" width="32" height="15" class="ynbg"/>
  <text x="1560" y="272" class="ynlabel">Yes</text>
  <path d="M 1380,325 L 1380,365" class="connector" marker-end="url(#arrow)"/>
  <rect x="1388" y="346" width="24" height="15" class="ynbg"/>
  <text x="1400" y="358" class="ynlabel">No</text>
  <path d="M 500,455 L 500,490 L 300,490 L 300,495" class="connector" marker-end="url(#arrow)"/>
  <rect x="384" y="470" width="32" height="15" class="ynbg"/>
  <text x="400" y="482" class="ynlabel">Yes</text>
  <path d="M 500,455 L 500,490 L 770,490 L 770,495" class="connector" marker-end="url(#arrow)"/>
  <rect x="623" y="470" width="24" height="15" class="ynbg"/>
  <text x="635" y="482" class="ynlabel">No</text>
  <path d="M 1380,455 L 1380,490 L 1180,490 L 1180,508" class="connector" marker-end="url(#arrow)"/>
  <rect x="1264" y="470" width="32" height="15" class="ynbg"/>
  <text x="1280" y="482" class="ynlabel">Yes</text>
  <path d="M 1540,410 L 1620,410 L 1620,312" class="connector" marker-end="url(#arrow)"/>
  <rect x="1538" y="390" width="24" height="15" class="ynbg"/>
  <text x="1550" y="402" class="ynlabel">No</text>
  <path d="M 300,585 L 300,620 L 170,620 L 170,625" class="connector" marker-end="url(#arrow)"/>
  <rect x="219" y="600" width="32" height="15" class="ynbg"/>
  <text x="235" y="612" class="ynlabel">Yes</text>
  <path d="M 300,585 L 300,620 L 500,620 L 500,625" class="connector" marker-end="url(#arrow)"/>
  <rect x="388" y="600" width="24" height="15" class="ynbg"/>
  <text x="400" y="612" class="ynlabel">No</text>
  <path d="M 930,540 L 1040,540 L 1040,798" class="connector" marker-end="url(#arrow)"/>
  <rect x="954" y="520" width="32" height="15" class="ynbg"/>
  <text x="970" y="532" class="ynlabel">Yes</text>
  <path d="M 770,585 L 770,630 L 830,630 L 830,625" class="connector" marker-end="url(#arrow)"/>
  <rect x="783" y="610" width="24" height="15" class="ynbg"/>
  <text x="795" y="622" class="ynlabel">No</text>
  <path d="M 170,715 L 170,780 L 90,780 L 90,792" class="connector" marker-end="url(#arrow)"/>
  <rect x="119" y="760" width="32" height="15" class="ynbg"/>
  <text x="135" y="772" class="ynlabel">Yes</text>
  <path d="M 170,715 L 170,780 L 280,780 L 280,798" class="connector" marker-end="url(#arrow)"/>
  <rect x="213" y="760" width="24" height="15" class="ynbg"/>
  <text x="225" y="772" class="ynlabel">No</text>
  <path d="M 500,715 L 500,780 L 470,780 L 470,798" class="connector" marker-end="url(#arrow)"/>
  <rect x="474" y="760" width="32" height="15" class="ynbg"/>
  <text x="490" y="772" class="ynlabel">Yes</text>
  <path d="M 500,715 L 500,780 L 660,780 L 660,798" class="connector" marker-end="url(#arrow)"/>
  <rect x="568" y="760" width="24" height="15" class="ynbg"/>
  <text x="580" y="772" class="ynlabel">No</text>
  <path d="M 830,715 L 830,780 L 850,780 L 850,798" class="connector" marker-end="url(#arrow)"/>
  <rect x="836" y="760" width="32" height="15" class="ynbg"/>
  <text x="852" y="772" class="ynlabel">Yes</text>
  <path d="M 990,670 L 990,670 L 990,800 L 1040,800 L 1040,798" class="connector" marker-end="url(#arrow)"/>
  <rect x="988" y="650" width="24" height="15" class="ynbg"/>
  <text x="1000" y="662" class="ynlabel">No</text>

  <!-- Nodes -->
  <g>
    <title>Start</title>
    <rect x="855" y="16" width="160" height="48" rx="24" ry="24" class="start"/>
    <text x="935" y="45" class="ttext">Start</text>
  </g>
  <g>
    <title>Do you frequently insert, update, or delete vector data, and need search results in real time or near real time?</title>
    <rect x="775" y="95" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="935" y="128" class="qtext">Do you frequently insert, update, or</text>
    <text x="935" y="145" class="qtext">delete vector data, and need search</text>
    <text x="935" y="162" class="qtext">results in real time or near real time?</text>
  </g>
  <g>
    <title>Do you need ultra-low latency in-memory vector search, or are you already using Azure Managed Redis?</title>
    <rect x="340" y="235" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="500" y="268" class="qtext">Do you need ultra-low latency</text>
    <text x="500" y="285" class="qtext">in-memory vector search, or are you</text>
    <text x="500" y="302" class="qtext">already using Azure Managed Redis?</text>
  </g>
  <g>
    <title>Do you need first-class hybrid search with semantic reranking, or need to index large-scale unstructured content?</title>
    <rect x="1220" y="235" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="1380" y="268" class="qtext">Do you need first-class hybrid search</text>
    <text x="1380" y="285" class="qtext">with semantic reranking, or need to</text>
    <text x="1380" y="302" class="qtext">index large-scale unstructured content?</text>
  </g>
  <g>
    <title>Do you prefer a relational database management system (RDBMS)?</title>
    <rect x="340" y="365" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="500" y="406.5" class="qtext">Do you prefer a relational database</text>
    <text x="500" y="423.5" class="qtext">management system (RDBMS)?</text>
  </g>
  <g>
    <title>Is cost optimization a top priority, or are you already operating a database service that supports vector search?</title>
    <rect x="1220" y="365" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="1380" y="398" class="qtext">Is cost optimization a top priority,</text>
    <text x="1380" y="415" class="qtext">or are you already operating a database</text>
    <text x="1380" y="432" class="qtext">service that supports vector search?</text>
  </g>
  <g>
    <title>Do your embeddings exceed 1,998 dimensions?</title>
    <rect x="140" y="495" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="300" y="536.5" class="qtext">Do your embeddings exceed</text>
    <text x="300" y="553.5" class="qtext">1,998 dimensions?</text>
  </g>
  <g>
    <title>Do you want to keep operational data and vector search in the same store, with hybrid search and built-in reranking?</title>
    <rect x="610" y="495" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="770" y="528" class="qtext">Do you want to keep operational data</text>
    <text x="770" y="545" class="qtext">and vector search in the same store,</text>
    <text x="770" y="562" class="qtext">with hybrid search and built-in reranking?</text>
  </g>
  <g>
    <title>Do you need horizontal sharding (Elastic Clusters / Citus) for very large vector datasets?</title>
    <rect x="10" y="625" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="170" y="658" class="qtext">Do you need horizontal sharding</text>
    <text x="170" y="675" class="qtext">(Elastic Clusters / Citus) for</text>
    <text x="170" y="692" class="qtext">very large vector datasets?</text>
  </g>
  <g>
    <title>Do you prefer Azure SQL Database over Azure Database for PostgreSQL?</title>
    <rect x="340" y="625" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="500" y="666.5" class="qtext">Do you prefer Azure SQL Database</text>
    <text x="500" y="683.5" class="qtext">over Azure Database for PostgreSQL?</text>
  </g>
  <g>
    <title>Do you need vector dimensions up to 16,000, or MongoDB-compatible APIs?</title>
    <rect x="670" y="625" width="320" height="90" rx="10" ry="10" class="decision"/>
    <text x="830" y="666.5" class="qtext">Do you need vector dimensions up to</text>
    <text x="830" y="683.5" class="qtext">16,000, or MongoDB-compatible APIs?</text>
  </g>
  <g>
    <title>Azure Managed Redis</title>
    <rect x="60" y="248" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="150" y="285" class="ttext">Azure Managed Redis</text>
  </g>
  <g>
    <title>Azure AI Search</title>
    <rect x="1530" y="248" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="1620" y="285" class="ttext">Azure AI Search</text>
  </g>
  <g>
    <title>Reuse your existing database service</title>
    <rect x="1090" y="508" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="1180" y="536.5" class="ttext">Reuse your existing</text>
    <text x="1180" y="553.5" class="ttext">database service</text>
  </g>
  <g>
    <title>Azure Database for PostgreSQL with Elastic Clusters</title>
    <rect x="0" y="792" width="180" height="76" rx="8" ry="8" class="terminal"/>
    <text x="90" y="818" class="ttext">Azure Database for</text>
    <text x="90" y="835" class="ttext">PostgreSQL with</text>
    <text x="90" y="852" class="ttext">Elastic Clusters</text>
  </g>
  <g>
    <title>Azure Database for PostgreSQL</title>
    <rect x="190" y="798" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="280" y="826.5" class="ttext">Azure Database</text>
    <text x="280" y="843.5" class="ttext">for PostgreSQL</text>
  </g>
  <g>
    <title>Azure SQL Database</title>
    <rect x="380" y="798" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="470" y="835" class="ttext">Azure SQL Database</text>
  </g>
  <g>
    <title>Azure Database for PostgreSQL</title>
    <rect x="570" y="798" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="660" y="826.5" class="ttext">Azure Database</text>
    <text x="660" y="843.5" class="ttext">for PostgreSQL</text>
  </g>
  <g>
    <title>Azure DocumentDB</title>
    <rect x="760" y="798" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="850" y="835" class="ttext">Azure DocumentDB</text>
  </g>
  <g>
    <title>Azure Cosmos DB for NoSQL</title>
    <rect x="950" y="798" width="180" height="64" rx="8" ry="8" class="terminal"/>
    <text x="1040" y="826.5" class="ttext">Azure Cosmos DB</text>
    <text x="1040" y="843.5" class="ttext">for NoSQL</text>
  </g>
</svg>
