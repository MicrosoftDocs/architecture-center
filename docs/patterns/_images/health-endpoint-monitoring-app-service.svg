<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title description" font-family="Segoe UI, sans-serif" font-size="16" fill="#242424">
  <title id="title">App Service health endpoint monitoring</title>
  <desc id="description">An external monitor probes liveness. App Service Health check probes readiness. Only readiness checks SQL Database and Managed Redis. Health check evaluates failure thresholds and instance exclusion limits before changing traffic routing.</desc>
